# Deploys main to Cloudflare. Needs repository secrets CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID; without them it reports "skipped" instead of failing.
# Production migrations run in their own job, behind the "production" environment, so they can
# require a reviewer (Settings → Environments → production → Required reviewers).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then echo "configured=true" >> "$GITHUB_OUTPUT";
          else echo "configured=false" >> "$GITHUB_OUTPUT"; echo "::notice::Deploy skipped: add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets to enable it."; fi

  migrate:
    needs: preflight
    if: needs.preflight.outputs.configured == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply reviewed D1 migrations
        working-directory: workers/api
        run: pnpm exec wrangler d1 migrations apply DB --remote

  deploy:
    needs: migrate
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build frontend
        run: pnpm build
      - name: Check deploy readiness
        run: bash scripts/validate-env.sh
      - name: Deploy Worker and frontend assets
        id: deploy
        working-directory: workers/api
        run: |
          pnpm exec wrangler deploy | tee "$RUNNER_TEMP/deploy.log"
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Upload FFmpeg core if missing
        working-directory: workers/api
        run: |
          base="${{ steps.deploy.outputs.url }}/vendor/ffmpeg-core/$(node -p "require('../../renderer/node_modules/@ffmpeg/core/package.json').version")"
          if curl -sfI "$base/ffmpeg-core.wasm" > /dev/null; then echo "FFmpeg core already present."; else bash ../../scripts/upload-ffmpeg-core.sh --remote; fi
      - name: Health check
        run: |
          for i in 1 2 3 4 5 6; do
            body=$(curl -sf "${{ steps.deploy.outputs.url }}/api/v1/health") && break
            sleep 10
          done
          echo "$body"
          echo "$body" | grep -q '"status":"ok"'
      - name: Report deployment status
        if: always()
        run: |
          {
            echo "### Deployment ${{ job.status }}"
            echo "- URL: ${{ steps.deploy.outputs.url || 'n/a' }}"
            echo "- Commit: ${GITHUB_SHA::7}"
            echo "- Roll back a bad release: \`pnpm --filter @avs/api exec wrangler rollback\` (D1 data is not rolled back)."
          } >> "$GITHUB_STEP_SUMMARY"
