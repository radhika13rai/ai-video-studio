name: Format render cleanup once

on:
  push:
    branches:
      - fix/render-upload-cleanup-snapshot

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write workers/api/src/routes/render.ts workers/api/tests/render.test.ts
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workers/api/src/routes/render.ts workers/api/tests/render.test.ts
          git commit -m "Format render lease cleanup changes"
          git push
