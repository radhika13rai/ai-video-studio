name: Format PR #32 test files
on:
  push:
    branches:
      - feat/render-reliability-lease-cleanup
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write workers/api/tests/regenerate-export.test.ts workers/api/tests/workflow.test.ts
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            echo 'Files are already formatted.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add workers/api/tests/regenerate-export.test.ts workers/api/tests/workflow.test.ts
          git commit -m 'Format rollback regression tests'
          git push origin HEAD:${GITHUB_REF_NAME}
